- name: piece-windows
  title: "[P/ECE](https://aquaplus.jp/piece/) 用アプリケーション（ホストPC用）"
  items:
    - name: PFXA
      download: ./files/PFXA_20050408.zip
      description: グラフィカルな P/ECE 用ファイル転送ソフト
    - name: par
      download: ./files/par_20050321.zip
      description: P/ECE の fpk 書庫ファイルを作成・展開．P/ECE 用展開ライブラリ libfpk もバンドル
    - name: pieceif.pas
      download: ./files/PieceIF.zip
      description: pieceif.dll を Delphi から使うためのユニット（Delphi ソース）
    - name: funpack
      download: https://github.com/autch/funpack/releases
      github: autch/funpack
      description: おでかけマルチのアーカイブファイル（LZSS 圧縮）を作成・展開
- name: piece-dev
  title: "[P/ECE](https://aquaplus.jp/piece/) 開発ツール・エミュレータ"
  items:
    - name: piece-toolchain-llvm
      github: autch/piece-toolchain-llvm
      description: Clang/LLVM ベースの P/ECE (EPSON S1C33209) 用 C/C++ ツールチェイン。ランタイムライブラリもソースからビルドし、純正 SDK 非依存
    - name: rust-toolchain-s1c33
      github: autch/rust-toolchain-s1c33
      description: P/ECE（EPSON S1C33）向け Rust ツールチェイン
    - name: piece-emu
      github: autch/piece-emu
      description: P/EMU/SDL の実質作り直し。元はコンパイラ開発向けの診断用エミュだったが、普通にフルシステムエミュレータとしてゲームも動作し、libretro コアも同梱
    - name: P/EMU/SDL
      github: autch/piemu
      description: SDL による P/ECE エミュレータ
    - name: pieceif-libusb
      download: https://github.com/autch/pieceif-libusb/releases
      github: autch/pieceif-libusb
      description: pieceif.dll の libusb への移植
    - name: mucc
      github: autch/mucc
      description: P/ECE 標準音源 muslib の曲データコンパイラ（Un*x 対応版）
    - name: mucc-next
      github: autch/mucc-next
      description: P/ECE 標準音源ドライバ用の改良版コンパイラ
    - name: pceplayer.js
      github: autch/pceplayer.js
      description: JavaScript + Web Audio API による P/ECE 標準音源ドライバの実装
    - name: piece-pmds
      github: autch/piece-pmds
      description: P/ECE 用の自作曲データ集。mucc でコンパイルし、auPiECE.kpi または実機で再生
