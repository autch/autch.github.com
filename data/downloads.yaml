- name: windows
  title: Windows アプリケーション
  items:
    - name: chirami
      download: https://github.com/autch/chirami/releases
      github: autch/chirami
      description: Windows 10/11 x64 専用の高速軽量な画像ビューア
    - name: nokomo2
      github: autch/nokomo2
      description: KbMedia Player の現仕様プラグインを使う C++ ライブラリと、そのプラグインで各種サウンドファイルを wav へデコードする CLI ツール（のこもDecoder の後継）
    - name: mml2midfe
      github: autch/mml2midfe
      description: MML2MID の Windows 用フロントエンド（WTL 使用）
      download: ./files/mml2midfe_20061211.zip
    - name: のこもDecoder
      download: ./files/NokomoDecode_1.0.0.79_binary.zip
      source: ./files/NokomoDecode_1.0.0.79_source.zip
      description: KbMedia Player の旧仕様プラグインを利用して，各種サウンドファイルを wav ファイルへデコード
- name: kpi
  title: "[KbMedia Player](https://kobarin.sakura.ne.jp/) 用プラグイン"
  items:
    - name: kpiadx.kpi
      download: https://github.com/autch/kpiadx.kpi/releases
      github: autch/kpiadx.kpi
      description: CRI ADX フォーマットの音声・音楽を再生
    - name: auPiECE.kpi
      download: https://github.com/autch/auPiECE.kpi/releases
      github: autch/auPiECE.kpi
      description: <a href="https://aquaplus.jp/piece/">P/ECE</a> の標準音源（pmd 形式）用プラグイン
    - name: kpidop.kpi
      download: https://github.com/autch/kpidsd/releases
      github: autch/kpidsd
      description: DSD 音源を <a href="https://dsd-guide.com/dop-open-standard">DoP</a> 方式で再生（本体同梱）
    - name: kpid2p.kpi
      download: https://github.com/autch/kpidsd/releases
      github: autch/kpidsd
      description: DSD 音源を PCM に変換して再生（本体同梱）
    - name: kpisrla.kpi
      download: https://github.com/autch/kpisrla.kpi/releases
      github: autch/kpisrla.kpi
      description: 可逆圧縮音源 SRLA を再生
    - name: kpiffmpeg.kpi
      download: https://github.com/autch/kpiffmpeg/releases
      github: autch/kpiffmpeg
      description: 音楽ファイルのデコードを <a href="http://www.ffmpeg.org/">FFmpeg</a> に丸投げして再生
    - name: kpinwa2.kpi
      download: ./files/kpinwa2_2.21.zip
      github: autch/kpinwa2.kpi
      description: Visual Arts 系のゲームの音声・音楽を再生
    - name: auPPX.kpi
      download: ./files/auPPX_kpi-binary-1.04.zip
      source: ./files/auPPX_kpi-source-1.04.zip
      description: P/ECE の PCM ファイル（ppd, ppg, ppx）用プラグイン
- name: piece-me
  title: "[P/ECE](https://aquaplus.jp/piece/) 用アプリケーション（実機用）"
  items:
    - name: 連射速度測定器
      download: ./files/rensha_20030514.zip
      description: 一発ネタゲーム
    - name: (・∀・)
      download: ./files/jien.zip
